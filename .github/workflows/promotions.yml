# Keeps content/billing/current-promotions.mdx in step with the coupons marked "Announce publicly" in billing,
# and the stock, specs and price blocks on the plan pages in step with billing's /atbp/stock.json (scripts/stock.mjs).
# Commits only when something changed (a new "checked" time alone is not a change); the bridge VPS republishes the site and the support bot's knowledge base
# picks the page up from master on their own.
name: Current promotions and stock

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: current-promotions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write the page from billing
        run: node scripts/promotions.mjs
      - name: Write the stock blocks from billing
        if: ${{ !cancelled() }}
        run: node scripts/stock.mjs
        env:
          STOCK_KEEP_TIME: '1'
      - name: Commit when it changed
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- content; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git commit -m "Promotions and stock: update from billing"
          git push
